# Four-GB200 training and inference pod for issue 775.
# Dataset/model staging is handled by stage-pod.yaml before this pod is
# created, so GPUs are not reserved during the approximately 1.6 TiB download.

apiVersion: v1
kind: Pod
metadata:
  name: ${POD_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: fastvideo-tdm
    run: ${RUN_NAME}
    issue: "775"
spec:
  restartPolicy: Never
  schedulingGates:
    - name: issue-775/staging
  nodeSelector:
    node.kubernetes.io/instance-type: BM.GPU.GB200.4
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
  initContainers:
    - name: prepare-python-runtime
      image: ghcr.io/hao-ai-lab/fastvideo/fastvideo-dev:py3.12-cuda13.0.0-latest
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          RUNTIME_SOURCE=$(find /root/.local/share/uv/python \
              -mindepth 1 -maxdepth 1 -type d \
              -name 'cpython-3.12.*-linux-aarch64-gnu' -print -quit)
          [[ -n "$RUNTIME_SOURCE" ]]
          cp -a "$RUNTIME_SOURCE/." /runtime/cpython/
          cp -a /opt/venv/bin/. /runtime/venv-bin/
          for name in python python3 python3.12; do
              ln -sfn /opt/uv-python/cpython/bin/python3.12 \
                  "/runtime/venv-bin/$name"
          done
          chmod -R a+rX /runtime/cpython /runtime/venv-bin
      volumeMounts:
        - name: python-runtime
          mountPath: /runtime/cpython
        - name: venv-bin
          mountPath: /runtime/venv-bin
  containers:
    - name: main
      image: ghcr.io/hao-ai-lab/fastvideo/fastvideo-dev:py3.12-cuda13.0.0-latest
      imagePullPolicy: IfNotPresent
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          [[ -f "${POD_OUTPUT_ROOT}/.stage_done" ]]
          [[ -d "${POD_OUTPUT_ROOT}/repo/.git" ]]
          [[ -L "${POD_OUTPUT_ROOT}/repo/data/Wan-Syn_77x448x832_600k" ]]
          mkdir -p "${POD_OUTPUT_ROOT}/logs" "${POD_OUTPUT_ROOT}/output"
          cd "${POD_OUTPUT_ROOT}"
          echo "Pod $(hostname) started at $(date -u +%FT%TZ)"
          echo "Output root: ${POD_OUTPUT_ROOT}"
          echo "$$" > output/train.pid

          if [[ ! -f preflight/.preflight_done ]]; then
              echo "[pod] running four-GPU preflight"
              bash repo/.agents/k8s/run_preflight.sh "${POD_OUTPUT_ROOT}" \
                  > logs/preflight.launcher.out 2>&1
          else
              echo "[pod] preflight already complete"
          fi

          TRAIN_DONE=output/.train_done
          if [[ -f "${TRAIN_DONE}" ]] && grep -Fq "rc=0" "${TRAIN_DONE}"; then
              echo "[pod] training already complete"
              exec sleep infinity
          fi

          LATEST_CHECKPOINT=$(find output -mindepth 2 -maxdepth 2 -type f \
              -name .complete -path '*/checkpoint-*/*' -printf '%h\n' | \
              sort -V | tail -n 1)
          if [[ -z "${LATEST_CHECKPOINT}" && -s output/tracker/metrics.jsonl ]]; then
              echo "ERROR: partial training has no completed checkpoint" >&2
              exit 1
          fi

          if [[ -n "${LATEST_CHECKPOINT}" ]]; then
              echo "[pod] resuming training from ${LATEST_CHECKPOINT}"
              env RESUME_FROM_CHECKPOINT="${POD_OUTPUT_ROOT}/${LATEST_CHECKPOINT}" \
                  bash repo/.agents/k8s/run_train.sh "${POD_OUTPUT_ROOT}" \
                  > logs/train.launcher.out 2>&1
          else
              echo "[pod] starting 500-step training"
              bash repo/.agents/k8s/run_train.sh "${POD_OUTPUT_ROOT}" \
                  > logs/train.launcher.out 2>&1
          fi
          echo "[pod] training completed successfully"
          exec sleep infinity
      resources:
        requests:
          nvidia.com/gpu: 4
          cpu: "96"
          memory: 768Gi
          ephemeral-storage: 200Gi
        limits:
          nvidia.com/gpu: 4
          cpu: "144"
          memory: 896Gi
          ephemeral-storage: 400Gi
      env:
        - name: PATH
          value: "/opt/venv/bin:/usr/local/cuda/bin:/usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HUGGINGFACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HF_HOME
          value: "${SHARED_HF_HOME}"
        - name: TRANSFORMERS_CACHE
          value: "${SHARED_HF_HOME}/hub"
        - name: HF_DATASETS_CACHE
          value: "${SHARED_HF_HOME}/datasets"
        - name: HF_HUB_CACHE
          value: "${SHARED_HF_HOME}/hub"
        - name: SHARED_HF_HOME
          value: "${SHARED_HF_HOME}"
        - name: RUN_NAME
          value: "${RUN_NAME}"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TQDM_DISABLE
          value: "1"
        - name: WANDB_MODE
          value: "disabled"
        - name: WANDB_API_KEY
          value: ""
        - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
          value: "1"
        - name: TRITON_CACHE_DIR
          value: "/tmp/triton-cache"
      volumeMounts:
        - name: workspace
          mountPath: /workspace/run
        - name: dshm
          mountPath: /dev/shm
        - name: cache-tmp
          mountPath: /tmp
        - name: python-runtime
          mountPath: /opt/uv-python/cpython
        - name: venv-bin
          mountPath: /opt/venv/bin
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: ${PVC_NAME}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
    - name: cache-tmp
      emptyDir:
        sizeLimit: 200Gi
    - name: python-runtime
      emptyDir: {}
    - name: venv-bin
      emptyDir: {}
