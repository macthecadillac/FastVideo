# Four-GB200 training and inference pod for issue 775.
# Dataset/model staging is handled by stage-pod.yaml before this pod is
# created, so GPUs are not reserved during the approximately 1.6 TiB download.

apiVersion: v1
kind: Pod
metadata:
  name: ${POD_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: fastvideo-tdm
    run: ${RUN_NAME}
    issue: "775"
spec:
  restartPolicy: Never
  nodeSelector:
    node.kubernetes.io/instance-type: BM.GPU.GB200.4
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
  containers:
    - name: main
      image: ghcr.io/hao-ai-lab/fastvideo/fastvideo-dev:py3.12-cuda13.0.0-latest
      imagePullPolicy: IfNotPresent
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          [[ -f "${POD_OUTPUT_ROOT}/.stage_done" ]]
          [[ -d "${POD_OUTPUT_ROOT}/repo/.git" ]]
          [[ -L "${POD_OUTPUT_ROOT}/repo/data/Wan-Syn_77x448x832_600k" ]]
          mkdir -p "${POD_OUTPUT_ROOT}/logs" "${POD_OUTPUT_ROOT}/output"
          echo "Pod $(hostname) ready at $(date -u +%FT%TZ)"
          echo "Output root: ${POD_OUTPUT_ROOT}"
          exec sleep infinity
      resources:
        requests:
          nvidia.com/gpu: 4
          cpu: "96"
          memory: 768Gi
          ephemeral-storage: 200Gi
        limits:
          nvidia.com/gpu: 4
          cpu: "144"
          memory: 896Gi
          ephemeral-storage: 400Gi
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HUGGINGFACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HF_HOME
          value: "${SHARED_HF_HOME}"
        - name: TRANSFORMERS_CACHE
          value: "${SHARED_HF_HOME}/hub"
        - name: HF_DATASETS_CACHE
          value: "${SHARED_HF_HOME}/datasets"
        - name: HF_HUB_CACHE
          value: "${SHARED_HF_HOME}/hub"
        - name: SHARED_HF_HOME
          value: "${SHARED_HF_HOME}"
        - name: RUN_NAME
          value: "${RUN_NAME}"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: TQDM_DISABLE
          value: "1"
        - name: WANDB_MODE
          value: "disabled"
        - name: WANDB_API_KEY
          value: ""
        - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
          value: "1"
      volumeMounts:
        - name: workspace
          mountPath: /workspace/run
        - name: dshm
          mountPath: /dev/shm
        - name: cache-tmp
          mountPath: /tmp
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: ${PVC_NAME}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 64Gi
    - name: cache-tmp
      emptyDir:
        sizeLimit: 200Gi
