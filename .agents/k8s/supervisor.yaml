# Cluster-resident transition from CPU staging to the four-GB200 workload.
#
# The Job watches the durable stage marker on Lustre and releases the gated
# GPU pod through the Kubernetes API. It therefore survives workstation
# disconnects and restarts.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${SUPERVISOR_RBAC_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: fastvideo-tdm-supervisor
    run: ${RUN_NAME}
    issue: "775"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${SUPERVISOR_RBAC_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: fastvideo-tdm-supervisor
    run: ${RUN_NAME}
    issue: "775"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["${POD_NAME}"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["${STAGE_POD_NAME}"]
    verbs: ["delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${SUPERVISOR_RBAC_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: fastvideo-tdm-supervisor
    run: ${RUN_NAME}
    issue: "775"
subjects:
  - kind: ServiceAccount
    name: ${SUPERVISOR_RBAC_NAME}
    namespace: ${K8S_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${SUPERVISOR_RBAC_NAME}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${SUPERVISOR_JOB_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: fastvideo-tdm-supervisor
    run: ${RUN_NAME}
    issue: "775"
spec:
  activeDeadlineSeconds: ${SUPERVISOR_TIMEOUT_SECONDS}
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: fastvideo-tdm-supervisor
        run: ${RUN_NAME}
        issue: "775"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ${SUPERVISOR_RBAC_NAME}
      nodeSelector:
        kubernetes.io/arch: arm64
        node.kubernetes.io/instance-type: VM.Standard.A2.Flex
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: supervisor
          image: ghcr.io/hao-ai-lab/fastvideo/fastvideo-dev:py3.12-cuda13.0.0-latest@sha256:38ab2b14899eceb1d3c5e53fc4369c5523369244b3fd51284feff4181f6e948c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
              CA_FILE=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
              PODS_API="${API}/api/v1/namespaces/${K8S_NAMESPACE}/pods"
              STAGE_DONE="${POD_OUTPUT_ROOT}/.stage_done"
              RESPONSE=/tmp/kubernetes-response.json

              request() {
                  curl --silent --show-error \
                      --cacert "${CA_FILE}" \
                      -H "Authorization: Bearer $(cat "${TOKEN_FILE}")" \
                      "$@"
              }

              echo "[supervisor] waiting for ${STAGE_DONE}"
              while true; do
                  if [[ -f "${STAGE_DONE}" ]] &&
                     grep -Fxq "commit=${COMMIT}" "${STAGE_DONE}"; then
                      break
                  fi

                  status=$(request -o "${RESPONSE}" -w '%{http_code}' \
                      "${PODS_API}/${STAGE_POD_NAME}" || true)
                  if [[ "${status}" == "200" ]] &&
                     grep -Eq '"phase"[[:space:]]*:[[:space:]]*"(Failed|Unknown)"' "${RESPONSE}"; then
                      cat "${RESPONSE}" >&2
                      echo "ERROR: staging pod entered a terminal failure phase" >&2
                      exit 1
                  fi
                  sleep 60
              done

              echo "[supervisor] stage marker verified for commit ${COMMIT}"
              status=$(request -o "${RESPONSE}" -w '%{http_code}' \
                  "${PODS_API}/${POD_NAME}" || true)
              if [[ "${status}" != "200" ]]; then
                  cat "${RESPONSE}" >&2
                  echo "ERROR: gated GPU pod lookup returned HTTP ${status}" >&2
                  exit 1
              fi
              if ! grep -Eq '"run"[[:space:]]*:[[:space:]]*"${RUN_NAME}"' "${RESPONSE}"; then
                  cat "${RESPONSE}" >&2
                  echo "ERROR: gated GPU pod does not match this run" >&2
                  exit 1
              fi
              if grep -Eq '"phase"[[:space:]]*:[[:space:]]*"(Failed|Succeeded|Unknown)"' "${RESPONSE}"; then
                  cat "${RESPONSE}" >&2
                  echo "ERROR: gated GPU pod is already terminal" >&2
                  exit 1
              fi

              if grep -Eq '"name"[[:space:]]*:[[:space:]]*"issue-775/staging"' "${RESPONSE}"; then
                  status=$(request -o "${RESPONSE}" -w '%{http_code}' \
                      -X PATCH \
                      -H 'Content-Type: application/merge-patch+json' \
                      --data '{"spec":{"schedulingGates":[]}}' \
                      "${PODS_API}/${POD_NAME}" || true)
                  if [[ "${status}" != "200" ]]; then
                      cat "${RESPONSE}" >&2
                      echo "ERROR: GPU scheduling-gate release returned HTTP ${status}" >&2
                      exit 1
                  fi
                  echo "[supervisor] released GPU pod ${POD_NAME} to the scheduler"
              elif grep -Eq '"phase"[[:space:]]*:[[:space:]]*"(Pending|Running)"' "${RESPONSE}"; then
                  echo "[supervisor] GPU pod ${POD_NAME} was already released"
              else
                  cat "${RESPONSE}" >&2
                  echo "ERROR: GPU pod has no staging gate or schedulable phase" >&2
                  exit 1
              fi

              request -o /dev/null -X DELETE \
                  "${PODS_API}/${STAGE_POD_NAME}" || true
              echo "[supervisor] transition complete"
          env:
            - name: COMMIT
              value: "${COMMIT}"
            - name: K8S_NAMESPACE
              value: "${K8S_NAMESPACE}"
            - name: POD_NAME
              value: "${POD_NAME}"
            - name: POD_OUTPUT_ROOT
              value: "${POD_OUTPUT_ROOT}"
            - name: RUN_NAME
              value: "${RUN_NAME}"
            - name: STAGE_POD_NAME
              value: "${STAGE_POD_NAME}"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace/run
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: ${PVC_NAME}
