# CPU-only staging pod for the issue-775 TDM run.
#
# This pod verifies the ARM64 image and Lustre write path, checks out the exact
# FastVideo commit, and stages the shared Wan model and Wan-Syn dataset cache.
# It intentionally requests no GPU, so dataset download does not reserve a
# GB200 node.

apiVersion: v1
kind: Pod
metadata:
  name: ${STAGE_POD_NAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: fastvideo-tdm-stage
    run: ${RUN_NAME}
    issue: "775"
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/arch: arm64
    node.kubernetes.io/instance-type: VM.Standard.A2.Flex
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
  initContainers:
    - name: prepare-python-runtime
      image: ghcr.io/hao-ai-lab/fastvideo/fastvideo-dev:py3.12-cuda13.0.0-latest
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          RUNTIME_SOURCE=$(find /root/.local/share/uv/python \
              -mindepth 1 -maxdepth 1 -type d \
              -name 'cpython-3.12.*-linux-aarch64-gnu' -print -quit)
          [[ -n "$RUNTIME_SOURCE" ]]
          cp -a "$RUNTIME_SOURCE/." /runtime/cpython/
          cp -a /opt/venv/bin/. /runtime/venv-bin/
          for name in python python3 python3.12; do
              ln -sfn /opt/uv-python/cpython/bin/python3.12 \
                  "/runtime/venv-bin/$name"
          done
          chmod -R a+rX /runtime/cpython /runtime/venv-bin
      volumeMounts:
        - name: python-runtime
          mountPath: /runtime/cpython
        - name: venv-bin
          mountPath: /runtime/venv-bin
  containers:
    - name: stage
      image: ghcr.io/hao-ai-lab/fastvideo/fastvideo-dev:py3.12-cuda13.0.0-latest
      imagePullPolicy: IfNotPresent
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          export HF_HOME="${SHARED_HF_HOME}"
          export HF_HUB_CACHE="${SHARED_HF_HOME}/hub"
          export HF_DATASETS_CACHE="${SHARED_HF_HOME}/datasets"
          export TOKENIZERS_PARALLELISM=false

          echo "[stage] start $(date -u +%FT%TZ) arch=$(uname -m)"
          [[ "$(uname -m)" == "aarch64" ]]
          python3 -c "import huggingface_hub, torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

          mkdir -p "${SHARED_HF_HOME}" \
              "${POD_OUTPUT_ROOT}/logs" \
              "${POD_OUTPUT_ROOT}/output"
          touch "${POD_OUTPUT_ROOT}/.lustre-write-test"
          rm -f "${POD_OUTPUT_ROOT}/.lustre-write-test"

          cd "${POD_OUTPUT_ROOT}"
          if [[ -d repo/.git ]]; then
              echo "[stage] refreshing existing repo"
              git -C repo remote set-url origin https://github.com/macthecadillac/FastVideo.git
              git -C repo fetch --filter=blob:none origin "${BRANCH}"
          elif [[ -e repo ]]; then
              echo "ERROR: ${POD_OUTPUT_ROOT}/repo exists but is not a git checkout" >&2
              exit 1
          else
              echo "[stage] cloning FastVideo"
              git clone --no-checkout --filter=blob:none \
                  https://github.com/macthecadillac/FastVideo.git repo
              git -C repo fetch --filter=blob:none origin "${BRANCH}"
          fi
          git -C repo checkout --detach "${COMMIT}"
          [[ "$(git -C repo rev-parse HEAD)" == "${COMMIT}" ]]
          echo "[stage] repo HEAD ${COMMIT}"

          download_snapshot() {
              local repo_id=$1
              local repo_type=$2
              local label=$3
              local attempt current_write last_write pid result_file snapshot stagnant state
              result_file="${POD_OUTPUT_ROOT}/.download-${label}.out"

              for attempt in 1 2 3 4; do
                  rm -f "${result_file}"
                  echo "[stage] ${label} download attempt ${attempt}/4" >&2
                  DOWNLOAD_REPO_ID="${repo_id}" DOWNLOAD_REPO_TYPE="${repo_type}" \
                      python3 - <<'PYDOWNLOAD' > "${result_file}" &
          import os
          from huggingface_hub import snapshot_download

          kwargs = {
              "repo_id": os.environ["DOWNLOAD_REPO_ID"],
              "cache_dir": os.environ["HF_HUB_CACHE"],
          }
          if os.environ["DOWNLOAD_REPO_TYPE"]:
              kwargs["repo_type"] = os.environ["DOWNLOAD_REPO_TYPE"]
          print(snapshot_download(**kwargs), flush=True)
          PYDOWNLOAD
                  pid=$!
                  stagnant=0
                  last_write=$(awk '$1 == "write_bytes:" {print $2}' \
                      "/proc/${pid}/io" 2>/dev/null || echo 0)

                  while [[ -r "/proc/${pid}/status" ]]; do
                      state=$(awk '$1 == "State:" {print $2}' \
                          "/proc/${pid}/status" 2>/dev/null || true)
                      [[ "${state}" != "Z" ]] || break
                      sleep 30
                      [[ -r "/proc/${pid}/io" ]] || break
                      current_write=$(awk '$1 == "write_bytes:" {print $2}' \
                          "/proc/${pid}/io" 2>/dev/null || echo 0)
                      if [[ "${current_write}" =~ ^[0-9]+$ ]] &&
                         (( current_write > last_write )); then
                          last_write=${current_write}
                          stagnant=0
                      else
                          ((stagnant += 1))
                      fi
                      if (( stagnant >= 40 )); then
                          echo "WARN: ${label} made no filesystem writes for 20 minutes; restarting" >&2
                          kill "${pid}" 2>/dev/null || true
                          break
                      fi
                  done

                  if wait "${pid}"; then
                      snapshot=$(tail -n 1 "${result_file}")
                      if [[ -d "${snapshot}" ]]; then
                          printf '%s\n' "${snapshot}"
                          return 0
                      fi
                  fi
                  echo "WARN: ${label} attempt ${attempt} failed" >&2
                  sleep 30
              done
              echo "ERROR: ${label} download failed after four attempts" >&2
              return 1
          }

          echo "[stage] staging Wan 2.1 T2V 1.3B"
          MODEL_SNAPSHOT=$(download_snapshot \
              "Wan-AI/Wan2.1-T2V-1.3B-Diffusers" "" "model")
          [[ -d "${MODEL_SNAPSHOT}" ]]
          printf '%s\n' "${MODEL_SNAPSHOT}" > "${POD_OUTPUT_ROOT}/.model_snapshot"

          echo "[stage] staging Wan-Syn_77x448x832_600k"
          DATASET_SNAPSHOT=$(download_snapshot \
              "FastVideo/Wan-Syn_77x448x832_600k" "dataset" "dataset")
          [[ -d "${DATASET_SNAPSHOT}" ]]
          printf '%s\n' "${DATASET_SNAPSHOT}" > "${POD_OUTPUT_ROOT}/.dataset_snapshot"

          DATA_LINK="${POD_OUTPUT_ROOT}/repo/data/Wan-Syn_77x448x832_600k"
          mkdir -p "$(dirname "${DATA_LINK}")"
          if [[ -d "${DATA_LINK}" && ! -L "${DATA_LINK}" ]]; then
              echo "ERROR: ${DATA_LINK} is a directory, refusing to replace it" >&2
              exit 1
          fi
          rm -f "${DATA_LINK}"
          ln -s "${DATASET_SNAPSHOT}" "${DATA_LINK}"
          [[ "$(readlink -f "${DATA_LINK}")" == "$(readlink -f "${DATASET_SNAPSHOT}")" ]]
          PARQUET_SAMPLE=$(find -L "${DATASET_SNAPSHOT}" -type f -name '*.parquet' -print -quit)
          [[ -n "${PARQUET_SAMPLE}" ]]
          echo "[stage] parquet sample ${PARQUET_SAMPLE}"

          {
              echo "completed_at=$(date -u +%FT%TZ)"
              echo "commit=${COMMIT}"
              echo "model_snapshot=${MODEL_SNAPSHOT}"
              echo "dataset_snapshot=${DATASET_SNAPSHOT}"
          } > "${POD_OUTPUT_ROOT}/.stage_done.tmp"
          mv "${POD_OUTPUT_ROOT}/.stage_done.tmp" \
              "${POD_OUTPUT_ROOT}/.stage_done"
          echo "[stage] complete $(date -u +%FT%TZ)"
      env:
        - name: PATH
          value: "/opt/venv/bin:/usr/local/cuda/bin:/usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HUGGINGFACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HF_HOME
          value: "${SHARED_HF_HOME}"
        - name: HF_HUB_CACHE
          value: "${SHARED_HF_HOME}/hub"
        - name: HF_DATASETS_CACHE
          value: "${SHARED_HF_HOME}/datasets"
        - name: TOKENIZERS_PARALLELISM
          value: "false"
      resources:
        requests:
          cpu: "16"
          memory: 64Gi
          ephemeral-storage: 200Gi
        limits:
          cpu: "32"
          memory: 120Gi
          ephemeral-storage: 400Gi
      volumeMounts:
        - name: workspace
          mountPath: /workspace/run
        - name: cache-tmp
          mountPath: /tmp
        - name: python-runtime
          mountPath: /opt/uv-python/cpython
        - name: venv-bin
          mountPath: /opt/venv/bin
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: ${PVC_NAME}
    - name: cache-tmp
      emptyDir:
        sizeLimit: 200Gi
    - name: python-runtime
      emptyDir: {}
    - name: venv-bin
      emptyDir: {}
