# MixGRPO multi-reward single-frame RL: Wan 2.1 T2V 1.3B on text-only PickScore prompts.
#
# This config follows the DiffusionNFT PR #1450 scaffold but trains with
# GenRL-style clipped GRPO on a stochastic SDE window.

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: true
  old:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: false
    disable_custom_init_weights: true
  reference:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: false
    disable_custom_init_weights: true
  # Optional PromptRL text policy. Enable method.prompt_refinement.mode=model
  # after adding both prompt_refiner roles.
  # prompt_refiner:
  #   _target_: fastvideo.train.models.prompt_refiner.CausalLMPromptRefiner
  #   init_from: Qwen/Qwen2.5-0.5B-Instruct
  #   trainable: true
  # old_prompt_refiner:
  #   _target_: fastvideo.train.models.prompt_refiner.CausalLMPromptRefiner
  #   init_from: Qwen/Qwen2.5-0.5B-Instruct
  #   trainable: false

method:
  _target_: fastvideo.train.methods.rl.mix_grpo.MixGRPOMethod
  reward_fn:
    pickscore: 1.0
    clipscore: 1.0

  sampling:
    num_steps: 25
    scheduler: flow_match_euler
    trajectory: mixed_ode_sde
    flow_shift: inherit
    sde_window_start: 5
    sde_window_size: 10
    sde_noise_scale: 0.7

  validation:
    every_steps: 10
    num_steps: 40
    num_prompts: 16
    batch_size: 16
    log_samples: true
    seed: 42
    data_path:

  sample_train_batch_size: 6
  train_batch_size: 6
  num_batches_per_epoch: 48
  num_video_per_prompt: 24
  num_inner_epochs: 1

  clip_range: 0.0001
  advantage_epsilon: 0.0001
  weight_advantages: false
  kl_beta: 0.0001
  prompt_refinement:
    enabled: false
    mode: dataset_column
    refined_prompt_key: refined_prompt
    num_original_prompts: 0
    # For trainable PromptRL prompt rewriting:
    # mode: model
    # num_original_prompts: 1
  # prompt_refiner_learning_rate: 1.0e-6
  # prompt_clip_range: 0.2
  decay_type: 1
  adv_clip_max: 5
  max_grad_norm: 1.0
  ema:
    enabled: true
    decay: 0.9
    update_after_step: 0
    validation: true
  terminal_progress: true

training:
  distributed:
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    data_path: data/pickscore_text_only_preprocessed
    preprocessed_data_type: text_only
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 1
    num_height: 448
    num_width: 832
    num_frames: 1

  optimizer:
    learning_rate: 3.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 100000
    gradient_accumulation_steps: 48

  checkpoint:
    output_dir: outputs/wan2.1_mixgrpo_pick_clip
    training_state_checkpointing_steps: 30
    checkpoints_total_limit: 3

  tracker:
    project_name: mixgrpo_wan
    run_name: wan2.1_mixgrpo_pick_clip

  model:
    enable_gradient_checkpointing_type: full

pipeline:
  flow_shift: 8
